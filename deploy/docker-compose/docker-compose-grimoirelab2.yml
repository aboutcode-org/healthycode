name: compose

services:
    mariadb:
      image: mariadb@sha256:5e73baf8179b29f115101bb102763a47a017361f3e9792daccba6646c3ab1532 # 11.4.13
      expose:
        - "3306"
      environment:
        MYSQL_ROOT_PASSWORD: ""
        MYSQL_ALLOW_EMPTY_PASSWORD: yes
      healthcheck:
        test: [ "CMD", "/usr/local/bin/healthcheck.sh", "--su=root", "--connect", "--innodb_initialized" ]
        retries: 5
      volumes:
        - mariadb_data:/var/lib/mysql

    valkey:
      image: valkey/valkey:8
      expose:
        - "6379"
      healthcheck:
        test: [ "CMD", "valkey-cli", "--raw", "incr", "ping" ]
        retries: 5
      volumes:
        - valkey_data:/data

    grimoirelab_core:
      restart: on-failure:3
      image: grimoirelab/grimoirelab@sha256:2379f183d668ee01a165bece31e829850b15ec8a20d4367dbf708b363d2619ce #2.x
      environment:
        GRIMOIRELAB_DB_HOST: mariadb
        GRIMOIRELAB_DB_PORT: 3306
        GRIMOIRELAB_DB_DATABASE: core_db
        GRIMOIRELAB_DB_USER: root
        GRIMOIRELAB_DB_PASSWORD: ""
        GRIMOIRELAB_REDIS_HOST: valkey
        GRIMOIRELAB_REDIS_PORT: 6379
        GRIMOIRELAB_REDIS_PASSWORD: ""
        GRIMOIRELAB_SUPERUSER_USERNAME: admin
        GRIMOIRELAB_SUPERUSER_PASSWORD: admin
        GRIMOIRELAB_ALLOWED_HOST: "127.0.0.1,localhost,grimoirelab-nginx"
      expose:
        - "9314"
      volumes:
        - core-static:/core_static/
      depends_on:
        mariadb:
          condition: service_healthy
        valkey:
          condition: service_healthy
      command: grimoirelab run server

    grimoirelab_core_eventizers:
      restart: on-failure:3
      image: grimoirelab/grimoirelab@sha256:2379f183d668ee01a165bece31e829850b15ec8a20d4367dbf708b363d2619ce #2.x
      environment:
        GRIMOIRELAB_DB_HOST: mariadb
        GRIMOIRELAB_DB_PORT: 3306
        GRIMOIRELAB_DB_DATABASE: core_db
        GRIMOIRELAB_DB_USER: root
        GRIMOIRELAB_DB_PASSWORD: ""
        GRIMOIRELAB_REDIS_HOST: valkey
        GRIMOIRELAB_REDIS_PORT: 6379
        GRIMOIRELAB_REDIS_PASSWORD: ""
      depends_on:
        mariadb:
          condition: service_healthy
        valkey:
          condition: service_healthy
      command: grimoirelab run eventizers

    grimoirelab_core_archivists:
      restart: on-failure:3
      image: grimoirelab/grimoirelab@sha256:2379f183d668ee01a165bece31e829850b15ec8a20d4367dbf708b363d2619ce #2.x
      environment:
        GRIMOIRELAB_DB_HOST: mariadb
        GRIMOIRELAB_DB_PORT: 3306
        GRIMOIRELAB_DB_DATABASE: core_db
        GRIMOIRELAB_DB_USER: root
        GRIMOIRELAB_DB_PASSWORD: ""
        GRIMOIRELAB_REDIS_HOST: valkey
        GRIMOIRELAB_REDIS_PORT: 6379
        GRIMOIRELAB_REDIS_PASSWORD: ""
        GRIMOIRELAB_ARCHIVIST_STORAGE_URL: "https://opensearch-node1:9200"
        GRIMOIRELAB_ARCHIVIST_STORAGE_USERNAME: "admin"
        GRIMOIRELAB_ARCHIVIST_STORAGE_PASSWORD: "GrimoireLab.1"
      depends_on:
        mariadb:
          condition: service_healthy
        valkey:
          condition: service_healthy
        opensearch-node1:
          condition: service_started
      command: grimoirelab run archivists

    grimoirelab_core_ushers:
        restart: on-failure:3
        image: grimoirelab/grimoirelab@sha256:2379f183d668ee01a165bece31e829850b15ec8a20d4367dbf708b363d2619ce #2.x
        environment:
          GRIMOIRELAB_DB_HOST: mariadb
          GRIMOIRELAB_DB_PORT: 3306
          GRIMOIRELAB_DB_DATABASE: core_db
          GRIMOIRELAB_DB_USER: root
          GRIMOIRELAB_DB_PASSWORD: ""
          GRIMOIRELAB_REDIS_HOST: valkey
          GRIMOIRELAB_REDIS_PORT: 6379
          GRIMOIRELAB_REDIS_PASSWORD: ""
        depends_on:
          mariadb:
            condition: service_healthy
          valkey:
            condition: service_healthy
        command: grimoirelab run ushers

    sortinghat_worker:
      image: grimoirelab/sortinghat-worker@sha256:22cd68e8059aedec83e770975e7eb31477256ffd488ab85375ee4cc2c2eb9298 # 1.21.0
      environment:
        SORTINGHAT_SECRET_KEY: secret
        SORTINGHAT_DB_HOST: mariadb
        SORTINGHAT_DB_PORT: 3306
        SORTINGHAT_DB_DATABASE: core_db
        SORTINGHAT_DB_USER: root
        SORTINGHAT_DB_PASSWORD: ""
        SORTINGHAT_REDIS_HOST: valkey
        SORTINGHAT_REDIS_PORT: 6379
        SORTINGHAT_REDIS_PASSWORD: ""
      depends_on:
        mariadb:
          condition: service_healthy
        valkey:
          condition: service_healthy

    opensearch-node1:
      image: opensearchproject/opensearch@sha256:fafe3fc3587088674669235575aa166228c48bdb940294a8cdbbc1da75236a40 # 3.8.0
      environment:
        cluster.name: opensearch-cluster
        node.name: opensearch-node1
        discovery.type: single-node
        bootstrap.memory_lock: true
        OPENSEARCH_JAVA_OPTS: "-Xms2g -Xmx2g"
        OPENSEARCH_INITIAL_ADMIN_PASSWORD: "GrimoireLab.1"
      ulimits:
        memlock:
          soft: -1
          hard: -1
        nofile:
          soft: 65536
          hard: 65536
      expose:
        - "9200"
        - "9600"
      volumes:
        - opensearch_data:/usr/share/opensearch/data
      networks:
        default:
        shared:
          aliases:
            - grimoirelab-opensearch

    nginx:
      restart: on-failure:3
      image: nginx:1.31.4-alpine
      volumes:
        - ./default-grimoirelab-settings/nginx.conf.template:/etc/nginx/templates/default.conf.template
        - ./default-grimoirelab-settings/uwsgi_params:/etc/nginx/uwsgi_params
        - core-static:/grimoirelab_core:ro
      expose:
        - "8000"
      networks:
        default:
        shared:
          aliases:
            - grimoirelab-nginx
      depends_on:
        - grimoirelab_core
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8000/"]
        interval: 30s
        timeout: 10s
        retries: 5

volumes:
  mariadb_data:
  opensearch_data:
  valkey_data:
  core-static:

networks:
  default:
  shared:
    name: grimoirelab_shared
